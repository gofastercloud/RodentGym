<title>Page not found · RodentGym</title>

<link rel="icon" type="image/png" href="images/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap lost">
  <div>
    <img src="images/icon.png" alt="" width="96" height="96">
    <h1>This page has gone missing.</h1>
    <p>Like a dropped click, it never arrived. The link may be old, or the address may have a typo.</p>
    <div class="buttons">
      <a class="button button-primary" href="./">Go to the home page</a>
      <a class="button button-secondary" href="help.html">Read the help</a>
    </div>
  </div>
